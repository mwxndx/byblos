  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)" id="theme-color-light" />
  <meta name="theme-color" content="#000000" id="theme-color-meta" />

  <!-- Google Analytics -->
  <script>
    if (typeof window !== 'undefined' && window.location.hostname !== 'localhost' && window.location.protocol !== 'capacitor:' && !window.Capacitor?.isNativePlatform?.()) {
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-LKRPWS2FT3';
      s.crossOrigin = 'anonymous';
      document.head.appendChild(s);
    }
  </script>
  <script src="/gtag-init.js" async></script>
  <script>
    (function () {
      try {
        var path = window.location.pathname || '';
        var scope = 'default';
        if (path.indexOf('/seller') === 0) scope = 'seller';
        else if (path.indexOf('/creator') === 0) scope = 'creator';
        else if (path.indexOf('/buyer') === 0) scope = 'buyer';
        else if (path.indexOf('/shop') === 0) scope = 'shop';

        var key = 'byblos-theme-' + scope;
        var pref = localStorage.getItem(key);
        if (!pref) pref = localStorage.getItem('byblos-app-theme') || localStorage.getItem('byblos-theme-default') || 'system';

        var isDark = true;
        if (pref === 'light') {
          isDark = false;
        } else if (pref === 'dark') {
          isDark = true;
        } else if (window.matchMedia) {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        var resolved = isDark ? 'dark' : 'light';
        var doc = document.documentElement;
        doc.setAttribute('data-theme', resolved);
        if (isDark) {
          doc.classList.add('dark');
          doc.classList.remove('light');
        } else {
          doc.classList.add('light');
          doc.classList.remove('dark');
        }
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.setAttribute('content', isDark ? '#000000' : '#f5f4f0');
        var metaDark = document.getElementById('theme-color-dark');
        if (metaDark) metaDark.setAttribute('content', isDark ? '#000000' : '#f5f4f0');
        var metaLight = document.getElementById('theme-color-light');
        if (metaLight) metaLight.setAttribute('content', isDark ? '#000000' : '#f5f4f0');
        var statusMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusMeta) statusMeta.setAttribute('content', 'black-translucent');
      } catch (e) {}
    })();
  </script>
  <style>
    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
    }
    html[data-theme="light"]:not(.native-app):not(.capacitor-native),
    html[data-theme="light"]:not(.native-app):not(.capacitor-native) body,
    html[data-theme="light"]:not(.native-app):not(.capacitor-native) #root,
    html.light:not(.native-app):not(.capacitor-native),
    html.light:not(.native-app):not(.capacitor-native) body,
    html.light:not(.native-app):not(.capacitor-native) #root {
      background-color: #f5f4f0 !important;
      color: #0f0f0e !important;
    }
    html[data-theme="dark"],
    html[data-theme="dark"] body,
    html[data-theme="dark"] #root,
    html.dark,
    html.dark body,
    html.dark #root {
      background-color: #000000 !important;
      color: #f5f5f5 !important;
    }

    /* Pre-React initial splash screen */
    #initial-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      z-index: 99999;
      pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #initial-splash .splash-logo {
      height: auto;
      width: min(68vw, 260px);
      max-width: 260px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }
    #initial-splash .splash-logo-dark {
      display: block;
    }
    #initial-splash .splash-logo-light {
      display: none;
    }

    /* Standard browser tabs in light theme: match the light UI canvas (#f5f4f0) */
    @media not all and (display-mode: standalone) {
      html[data-theme="light"]:not(.native-app):not(.capacitor-native) #initial-splash,
      html.light:not(.native-app):not(.capacitor-native) #initial-splash {
        background-color: #f5f4f0 !important;
      }
      html[data-theme="light"]:not(.native-app):not(.capacitor-native) #initial-splash .splash-logo-dark,
      html.light:not(.native-app):not(.capacitor-native) #initial-splash .splash-logo-dark {
        display: none !important;
      }
      html[data-theme="light"]:not(.native-app):not(.capacitor-native) #initial-splash .splash-logo-light,
      html.light:not(.native-app):not(.capacitor-native) #initial-splash .splash-logo-light {
        display: block !important;
      }
    }

    /* Standalone PWA and native app cold launch: strictly locked to pure black (#000000) */
    @media (display-mode: standalone) {
      #initial-splash {
        background-color: #000000 !important;
      }
      #initial-splash .splash-logo-dark {
        display: block !important;
      }
      #initial-splash .splash-logo-light {
        display: none !important;
      }
    }
    html.native-app #initial-splash,
    html.capacitor-native #initial-splash {
      background-color: #000000 !important;
    }
  </style>

  <!-- Canonical URL is set per-route by <SEOHead> (react-helmet-async), not
       hardcoded here: this single static index.html is served for every route
       (see vercel.json), so a fixed canonical would make every deep page
       (/about, /shop/men, seller shops, …) declare the homepage as its
       canonical and get dropped from the index as a duplicate. Pages without
       SEOHead self-canonicalise to their own URL, and the apex→www redirect
       keeps that on the www host. -->
