name: Continuous Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Quality Gate: Lint, Typecheck, Static Application Contract Audit & Security
  # ---------------------------------------------------------------------------
  quality:
    name: Quality Gate (Typecheck, Lint, Security, App Audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Repository hygiene and secret leak check
        run: |
          echo "Verifying no unencrypted .env or private key files are committed..."
          FORBIDDEN_FILES=$(git ls-files | grep -E '(\.env(\.(local|production|staging))?$|\.pem$|\.key$)' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::error::Forbidden credential or environment files tracked in git: $FORBIDDEN_FILES"
            exit 1
          fi
          echo "Repository hygiene check passed."

      - name: Frontend Typecheck
        run: npm run typecheck

      - name: Frontend Lint
        run: npm run lint

      - name: Backend Lint
        working-directory: server
        run: |
          npm ci
          npm run lint

      - name: Static Application Contract Audit (71 checks)
        run: npm run test:app

  # ---------------------------------------------------------------------------
  # 2. Frontend Gate: Vitest Unit Tests & Coverage
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Vitest + Coverage)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.run_number }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. Backend & Database Gate: Postgres, Migrations, Integration & Journeys
  # ---------------------------------------------------------------------------
  backend:
    name: Backend & Database (Migrations, Integration, Journeys)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: byblos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write CI test environment
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=3003
          APP_NAME=Byblos-Test
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=byblos_test
          DB_SSL=false
          REDIS_URL=redis://localhost:6379
          JWT_SECRET=test_jwt_secret_value_must_be_at_least_32_characters_long
          JWT_REFRESH_SECRET=test_jwt_refresh_secret_value_must_be_at_least_32_characters_long
          JWT_EXPIRES_IN=1h
          JWT_REFRESH_EXPIRES_IN=1d
          FRONTEND_URL=http://localhost:3000
          BACKEND_URL=http://localhost:3003
          ALLOWED_ORIGINS=http://localhost:3000
          PAYMENT_PROVIDER=paystack
          PAYOUT_PROVIDER=paystack
          PAYSTACK_SECRET_KEY=sk_test_mock_secret_key_for_testing
          PAYSTACK_PUBLIC_KEY=pk_test_mock_public_key_for_testing
          PAYSTACK_BASE_URL=http://localhost:3003/mock-paystack
          EMAIL_FROM_EMAIL=no-reply@byblos.test
          EMAIL_FROM_NAME=Byblos Test
          EOF

      - name: Provision clean test schema
        env:
          NODE_ENV: test
        run: npm run db:test:setup

      - name: Run unit/contract tests
        run: npm test

      - name: Run database integration tests
        run: npm run test:integration

      - name: Run end-to-end business journey tests (Gates 1-4)
        run: npm run test:journeys

      - name: Capture backend test diagnostics on failure
        if: failure()
        run: |
          mkdir -p ../diagnostics
          echo "Capturing diagnostic logs..." > ../diagnostics/backend-failure.log
          git status --short >> ../diagnostics/backend-failure.log

      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics-${{ github.run_number }}
          path: diagnostics/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. E2E Browser Gate: Playwright Smoke Testing
  # ---------------------------------------------------------------------------
  e2e:
    name: Browser E2E (Playwright Smoke)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend for preview
        run: npm run build

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 5. Production Web Build Verification
  # ---------------------------------------------------------------------------
  build-verification:
    name: Production Build Verification
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Production Web Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # 6. Continuous Verification Aggregate Gate (Single Required PR Status Check)
  # ---------------------------------------------------------------------------
  continuous-verification:
    name: Continuous Verification
    needs: [quality, frontend, backend, e2e, build-verification]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate all verification gates
        run: |
          echo "========================================================"
          echo "CONTINUOUS VERIFICATION SUMMARY"
          echo "========================================================"
          echo "Quality Gate:              ${{ needs.quality.result }}"
          echo "Frontend Tests:            ${{ needs.frontend.result }}"
          echo "Backend & Journeys:        ${{ needs.backend.result }}"
          echo "Browser E2E:               ${{ needs.e2e.result }}"
          echo "Production Build:          ${{ needs.build-verification.result }}"
          echo "========================================================"

          # Check for any failures or cancellations
          FAILED=0
          for RESULT in "${{ needs.quality.result }}" "${{ needs.frontend.result }}" "${{ needs.backend.result }}" "${{ needs.e2e.result }}" "${{ needs.build-verification.result }}"; do
            if [ "$RESULT" != "success" ]; then
              FAILED=1
            fi
          done

          # Output markdown to GitHub Actions Step Summary
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          # 🛡️ Continuous Verification Results

          | Verification Gate | Result |
          | :--- | :---: |
          | **Quality Gate (Typecheck, Lint, Security, App Audit)** | ${{ needs.quality.result == 'success' && '✅ PASS' || '❌ FAIL' }} |
          | **Frontend (Vitest + Coverage)** | ${{ needs.frontend.result == 'success' && '✅ PASS' || '❌ FAIL' }} |
          | **Backend & Database (Migrations, Integration, Journeys)** | ${{ needs.backend.result == 'success' && '✅ PASS' || '❌ FAIL' }} |
          | **Browser E2E (Playwright Smoke)** | ${{ needs.e2e.result == 'success' && '✅ PASS' || '❌ FAIL' }} |
          | **Production Build Verification** | ${{ needs.build-verification.result == 'success' && '✅ PASS' || '❌ FAIL' }} |

          ---
          **Aggregate Status:** $([ "$FAILED" -eq 0 ] && echo "✅ **ALL VERIFICATION CHECKS PASSED — SAFE TO MERGE**" || echo "❌ **VERIFICATION FAILED — MERGE BLOCKED**")
          EOF

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more continuous verification checks failed. Merge is blocked."
            exit 1
          fi
          echo "All continuous verification checks passed successfully."
