<?xml version="1.0" encoding="UTF-8"?>
<svg width="1350" height="932" viewBox="0 0 1350 932" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Sora:wght@400;600;700&amp;display=swap');
      .font-inter { font-family: 'Inter', -apple-system, sans-serif; }
      .font-sora { font-family: 'Sora', sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1350" height="932" fill="#080808"/>

  <!-- Header -->
  <g transform="translate(60, 44)">
    <text class="font-inter" font-size="28" font-weight="700" fill="#ffffff">CURRENT Byblos UI Baseline</text>
    <text class="font-inter" y="28" font-size="14" font-weight="500" fill="#888888">Existing Production UI • Pure Black #000000 • Inter Font • 10px / 14px / 20px Radii • 42px-44px Controls</text>
  </g>

  <!-- Board 1: Current Specs -->
  
  <g id="Current-Tokens" transform="translate(60, 90)">
    <rect width="440" height="812" rx="40" fill="#050505" stroke="#1f1f1f" stroke-width="2"/>

    <text class="font-inter" x="32" y="48" font-size="22" font-weight="700" fill="#ffffff">Current Byblos Specs</text>
    <text class="font-inter" x="32" y="72" font-size="13" font-weight="400" fill="#888888">Existing Production Baseline</text>

    <!-- Color Swatches -->
    <g transform="translate(32, 100)">
      <!-- Swatch 1 -->
      <g transform="translate(0, 0)">
        <rect width="118" height="64" rx="10" fill="#000000" stroke="#333333" stroke-width="1"/>
        <text class="font-inter" x="12" y="32" font-size="13" font-weight="700" fill="#ffffff">#000000</text>
        <text class="font-inter" x="12" y="48" font-size="11" font-weight="500" fill="#888888">Pure Black Base</text>
      </g>
      <!-- Swatch 2 -->
      <g transform="translate(130, 0)">
        <rect width="118" height="64" rx="10" fill="#f5c518"/>
        <text class="font-inter" x="12" y="32" font-size="13" font-weight="700" fill="#000000">#f5c518</text>
        <text class="font-inter" x="12" y="48" font-size="11" font-weight="600" fill="#000000">Original Yellow</text>
      </g>
      <!-- Swatch 3 -->
      <g transform="translate(260, 0)">
        <rect width="118" height="64" rx="10" fill="#1c1c1e" stroke="#333333" stroke-width="1"/>
        <text class="font-inter" x="12" y="32" font-size="13" font-weight="700" fill="#ffffff">#1c1c1e</text>
        <text class="font-inter" x="12" y="48" font-size="11" font-weight="500" fill="#888888">Apple Surface-1</text>
      </g>
    </g>

    <!-- Radius Specs -->
    <text class="font-inter" x="32" y="210" font-size="16" font-weight="700" fill="#ffffff">Current Dimensions</text>

    <!-- Radius 10px -->
    <g transform="translate(32, 230)">
      <text class="font-inter" font-size="12" font-weight="600" fill="#888888">Control Radius: 10px (Current Button/Input)</text>
      <rect y="10" width="376" height="44" rx="10" fill="#f5c518"/>
      <text class="font-inter" x="188" y="38" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Current 44px Button (r=10px)</text>
    </g>

    <!-- Input 42px -->
    <g transform="translate(32, 314)">
      <text class="font-inter" font-size="12" font-weight="600" fill="#888888">Input Height: 42px (Current Field)</text>
      <rect y="10" width="376" height="42" rx="10" fill="#141414" stroke="#262626" stroke-width="1"/>
      <text class="font-inter" x="16" y="36" font-size="13" font-weight="400" fill="#888888">Current input placeholder...</text>
    </g>

    <!-- Card 14px -->
    <g transform="translate(32, 396)">
      <text class="font-inter" font-size="12" font-weight="600" fill="#888888">Card Radius: 14px (Current Card)</text>
      <rect y="10" width="376" height="84" rx="14" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
      <text class="font-inter" x="20" y="42" font-size="14" font-weight="600" fill="#ffffff">Current 14px Card Container</text>
      <text class="font-inter" x="20" y="64" font-size="12" font-weight="400" fill="#666666">Standard card boundary in current dashboards</text>
    </g>

    <!-- Typography Note -->
    <g transform="translate(32, 530)">
      <text class="font-inter" font-size="14" font-weight="700" fill="#ffffff">Font Stack</text>
      <text class="font-inter" y="24" font-size="12" font-weight="400" fill="#888888">-apple-system, Inter, system-ui</text>
      <text class="font-inter" y="44" font-size="12" font-weight="400" fill="#888888">Default mobile touch targets: 42px - 44px</text>
    </g>
  </g>
  

  <!-- Board 2: Current Sign In -->
  
  <g id="Current-SignIn" transform="translate(530, 90)">
    <!-- Screen Frame: 375 x 812, Pure Black #000000 -->
    <rect width="375" height="812" rx="40" fill="#000000" stroke="#222222" stroke-width="2"/>
    
    <g id="status-bar" transform="translate(24, 14)">
      <text class="font-inter" font-size="14" font-weight="600" fill="#ffffff" x="0" y="10">9:41</text>
      <g transform="translate(285, 0)">
        <rect x="0" y="7" width="3" height="5" rx="0.5" fill="#ffffff"/>
        <rect x="5" y="5" width="3" height="7" rx="0.5" fill="#ffffff"/>
        <rect x="10" y="3" width="3" height="9" rx="0.5" fill="#ffffff"/>
        <rect x="15" y="1" width="3" height="11" rx="0.5" fill="#ffffff"/>
        <path d="M 26 1 A 10 10 0 0 1 38 1 M 28 4 A 7 7 0 0 1 36 4 M 31 8 A 3 3 0 0 1 33 8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <rect x="44" y="0" width="22" height="12" rx="3" stroke="#ffffff" stroke-width="1.5" fill="none"/>
        <rect x="46" y="2" width="14" height="8" rx="1.5" fill="#ffffff"/>
        <path d="M 67 4 L 67 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>
  

    <!-- Current Tag Badge -->
    <g transform="translate(24, 46)">
      <rect width="112" height="24" rx="6" fill="#1c1c1e" stroke="#333333" stroke-width="1"/>
      <text class="font-inter" x="56" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#888888">CURRENT UI</text>
    </g>

    <!-- App Header: Back chevron -->
    <g transform="translate(24, 82)">
      <circle cx="16" cy="16" r="16" fill="#1a1a1a"/>
      <path d="M 18 11 L 13 16 L 18 21" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Byblos Wordmark / Logo -->
    <g transform="translate(24, 136)">
      <text class="font-inter" font-size="24" font-weight="700" fill="#f5c518" letter-spacing="1">BYBLOS</text>
      <text class="font-inter" y="26" font-size="13" font-weight="400" fill="#a3a3a3">Modern Social Commerce in Kenya</text>
    </g>

    <!-- Current Auth Card (Apple 14px radius, #0a0a0a surface) -->
    <g transform="translate(24, 195)">
      <rect width="327" height="420" rx="14" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
      
      <g transform="translate(20, 24)">
        <text class="font-inter" font-size="18" font-weight="600" fill="#f5f5f5">Buyer Sign In</text>
        <text class="font-inter" y="20" font-size="12" font-weight="400" fill="#a3a3a3">Enter your account credentials</text>

        <!-- Current Form Input 1 (h=42, r=10) -->
        <g transform="translate(0, 48)">
          <text class="font-inter" font-size="12" font-weight="500" fill="#a3a3a3">Email address</text>
          <rect y="8" width="287" height="42" rx="10" fill="#141414" stroke="#262626" stroke-width="1"/>
          <text class="font-inter" x="12" y="34" font-size="13" font-weight="400" fill="#f5f5f5">buyer@byblos.africa</text>
        </g>

        <!-- Current Form Input 2 (h=42, r=10) -->
        <g transform="translate(0, 126)">
          <text class="font-inter" font-size="12" font-weight="500" fill="#a3a3a3">Password</text>
          <rect y="8" width="287" height="42" rx="10" fill="#141414" stroke="#262626" stroke-width="1"/>
          <text class="font-inter" x="12" y="34" font-size="13" font-weight="400" fill="#f5f5f5">••••••••••••</text>
        </g>

        <!-- Current Forgot Link -->
        <text class="font-inter" x="287" y="196" text-anchor="end" font-size="12" font-weight="500" fill="#f5c518">Forgot password?</text>

        <!-- Current Button (h=44, r=10, #f5c518) -->
        <g transform="translate(0, 220)">
          <rect width="287" height="44" rx="10" fill="#f5c518"/>
          <text class="font-inter" x="143.5" y="27" text-anchor="middle" font-size="14" font-weight="600" fill="#000000">Sign In to Dashboard</text>
        </g>

        <!-- Divider -->
        <line x1="0" y1="288" x2="287" y2="288" stroke="#262626" stroke-width="1"/>

        <!-- Switch to register -->
        <text class="font-inter" x="143.5" y="318" text-anchor="middle" font-size="13" font-weight="400" fill="#a3a3a3">
          Don't have an account? <tspan fill="#f5c518" font-weight="600">Register</tspan>
        </text>

        <!-- Guest link -->
        <text class="font-inter" x="143.5" y="348" text-anchor="middle" font-size="12" font-weight="400" fill="#666666">
          Continue as Guest
        </text>
      </g>
    </g>

    <!-- Bottom Indicator -->
    <rect x="120" y="796" width="135" height="5" rx="2.5" fill="#333333"/>
  </g>
  

  <!-- Board 3: Current Marketplace -->
  
  <g id="Current-Marketplace" transform="translate(935, 90)">
    <!-- Screen Frame: 375 x 812, Pure Black -->
    <rect width="375" height="812" rx="40" fill="#000000" stroke="#222222" stroke-width="2"/>
    
    <g id="status-bar" transform="translate(24, 14)">
      <text class="font-inter" font-size="14" font-weight="600" fill="#ffffff" x="0" y="10">9:41</text>
      <g transform="translate(285, 0)">
        <rect x="0" y="7" width="3" height="5" rx="0.5" fill="#ffffff"/>
        <rect x="5" y="5" width="3" height="7" rx="0.5" fill="#ffffff"/>
        <rect x="10" y="3" width="3" height="9" rx="0.5" fill="#ffffff"/>
        <rect x="15" y="1" width="3" height="11" rx="0.5" fill="#ffffff"/>
        <path d="M 26 1 A 10 10 0 0 1 38 1 M 28 4 A 7 7 0 0 1 36 4 M 31 8 A 3 3 0 0 1 33 8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <rect x="44" y="0" width="22" height="12" rx="3" stroke="#ffffff" stroke-width="1.5" fill="none"/>
        <rect x="46" y="2" width="14" height="8" rx="1.5" fill="#ffffff"/>
        <path d="M 67 4 L 67 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>
  

    <!-- Current Tag Badge -->
    <g transform="translate(24, 46)">
      <rect width="112" height="24" rx="6" fill="#1c1c1e" stroke="#333333" stroke-width="1"/>
      <text class="font-inter" x="56" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#888888">CURRENT UI</text>
    </g>

    <!-- Current Marketplace Header -->
    <g transform="translate(24, 82)">
      <text class="font-inter" font-size="20" font-weight="700" fill="#ffffff">Marketplace</text>
      <!-- Current Creator Mode Button (Yellow pill) -->
      <g transform="translate(225, -6)">
        <rect width="102" height="32" rx="8" fill="#f5c518"/>
        <text class="font-inter" x="51" y="20" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">Creator ✨</text>
      </g>
    </g>

    <!-- Current Search Bar (h=42, r=10) -->
    <g transform="translate(24, 126)">
      <rect width="327" height="42" rx="10" fill="#141414" stroke="#262626" stroke-width="1"/>
      <circle cx="20" cy="21" r="6" stroke="#a3a3a3" stroke-width="1.5" fill="none"/>
      <line x1="24" y1="25" x2="28" y2="29" stroke="#a3a3a3" stroke-width="1.5"/>
      <text class="font-inter" x="38" y="26" font-size="13" font-weight="400" fill="#a3a3a3">Search shops or products...</text>
    </g>

    <!-- Current Storefront Card (r=14px) -->
    <g transform="translate(24, 184)">
      <rect width="327" height="116" rx="14" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
      <!-- Store Avatar -->
      <circle cx="44" cy="44" r="24" fill="#222222"/>
      <text class="font-inter" x="44" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#f5c518">SC</text>
      <!-- Details -->
      <text class="font-inter" x="80" y="38" font-size="15" font-weight="600" fill="#ffffff">Sana Canvas Nairobi</text>
      <text class="font-inter" x="80" y="56" font-size="12" font-weight="400" fill="#a3a3a3">Handmade Kenyan Canvas Bags</text>
      <!-- Current Client Badge (10px radius) -->
      <rect x="80" y="68" width="94" height="22" rx="6" fill="#1c1c1e" stroke="#333333" stroke-width="0.8"/>
      <text class="font-inter" x="127" y="83" text-anchor="middle" font-size="11" font-weight="500" fill="#f5c518">1,420 Clients</text>
    </g>

    <!-- Current Product Card Grid (r=14px) -->
    <g transform="translate(24, 316)">
      <!-- Product 1 -->
      <g transform="translate(0, 0)">
        <rect width="156" height="230" rx="14" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
        <rect x="10" y="10" width="136" height="110" rx="10" fill="#1a1a1a"/>
        <text class="font-inter" x="78" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#555555">[Photo]</text>
        <text class="font-inter" x="12" y="142" font-size="13" font-weight="600" fill="#ffffff">Vintage Tote</text>
        <text class="font-inter" x="12" y="162" font-size="14" font-weight="700" fill="#f5c518">Ksh 2,450</text>
        <text class="font-inter" x="12" y="180" font-size="11" font-weight="400" fill="#22c55e">In stock (14)</text>
        <!-- Add button (h=32, r=8) -->
        <rect x="12" y="190" width="132" height="30" rx="8" fill="#1c1c1e" stroke="#333333" stroke-width="1"/>
        <text class="font-inter" x="78" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">+ Add to Bag</text>
      </g>
      <!-- Product 2 -->
      <g transform="translate(171, 0)">
        <rect width="156" height="230" rx="14" fill="#0a0a0a" stroke="#262626" stroke-width="1"/>
        <rect x="10" y="10" width="136" height="110" rx="10" fill="#1a1a1a"/>
        <text class="font-inter" x="78" y="70" text-anchor="middle" font-size="13" font-weight="500" fill="#555555">[Photo]</text>
        <text class="font-inter" x="12" y="142" font-size="13" font-weight="600" fill="#ffffff">Safari Duffel</text>
        <text class="font-inter" x="12" y="162" font-size="14" font-weight="700" fill="#f5c518">Ksh 4,800</text>
        <text class="font-inter" x="12" y="180" font-size="11" font-weight="400" fill="#22c55e">In stock (6)</text>
        <rect x="12" y="190" width="132" height="30" rx="8" fill="#1c1c1e" stroke="#333333" stroke-width="1"/>
        <text class="font-inter" x="78" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">+ Add to Bag</text>
      </g>
    </g>

    <!-- Current Bottom Nav Bar (Pure black, h=56, flat top border) -->
    <g transform="translate(0, 756)">
      <rect width="375" height="56" fill="#000000" stroke="#262626" stroke-width="1"/>
      <g transform="translate(45, 18)">
        <path d="M 3 11 L 10 5 L 17 11 L 17 17 L 3 17 Z" stroke="#f5c518" stroke-width="1.8" fill="none"/>
      </g>
      <g transform="translate(125, 20)">
        <circle cx="8" cy="8" r="6" stroke="#a3a3a3" stroke-width="1.5" fill="none"/>
        <line x1="12" y1="12" x2="16" y2="16" stroke="#a3a3a3" stroke-width="1.5"/>
      </g>
      <g transform="translate(205, 20)">
        <rect width="14" height="16" rx="2" stroke="#a3a3a3" stroke-width="1.5" fill="none"/>
      </g>
      <g transform="translate(285, 20)">
        <rect width="14" height="14" rx="2" stroke="#a3a3a3" stroke-width="1.5" fill="none"/>
      </g>
    </g>

    <!-- Bottom Indicator -->
    <rect x="120" y="796" width="135" height="5" rx="2.5" fill="#333333"/>
  </g>
  
</svg>