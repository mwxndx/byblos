<?xml version="1.0" encoding="UTF-8"?>
<svg width="375" height="812" viewBox="0 0 375 812" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&amp;display=swap');
      .font-sora { font-family: 'Sora', -apple-system, sans-serif; }
    </style>
    <filter id="card-shadow" x="-8%" y="-4%" width="116%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="sheet-shadow" x="-5%" y="-10%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="-8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  
  <g id="Screen-StorefrontSheet" transform="translate(0, 0)">
    <!-- Screen Frame (375 x 812, r=40) -->
    <rect width="375" height="812" rx="40" fill="#1c1c1c" stroke="#333333" stroke-width="2"/>
    
    <g id="status-bar" transform="translate(24, 14)">
      <text class="font-sora" font-size="14" font-weight="600" fill="#ffffff" x="0" y="10">9:41</text>
      <g transform="translate(285, 0)">
        <!-- Signal -->
        <rect x="0" y="7" width="3" height="5" rx="0.5" fill="#ffffff"/>
        <rect x="5" y="5" width="3" height="7" rx="0.5" fill="#ffffff"/>
        <rect x="10" y="3" width="3" height="9" rx="0.5" fill="#ffffff"/>
        <rect x="15" y="1" width="3" height="11" rx="0.5" fill="#ffffff"/>
        <!-- Wifi -->
        <path d="M 26 1 A 10 10 0 0 1 38 1 M 28 4 A 7 7 0 0 1 36 4 M 31 8 A 3 3 0 0 1 33 8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <!-- Battery -->
        <rect x="44" y="0" width="22" height="12" rx="3" stroke="#ffffff" stroke-width="1.5" fill="none"/>
        <rect x="46" y="2" width="14" height="8" rx="1.5" fill="#ffffff"/>
        <path d="M 67 4 L 67 8" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>
  

    <!-- App Header -->
    <g transform="translate(24, 52)">
      <rect width="40" height="40" rx="12" fill="#262626" stroke="#3d3d3d" stroke-width="1"/>
      <path d="M 23 14 L 17 20 L 23 26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <text class="font-sora" x="163.5" y="25" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Sana Canvas Store</text>

      <rect x="287" y="0" width="40" height="40" rx="12" fill="#262626" stroke="#3d3d3d" stroke-width="1"/>
      <!-- Bag icon -->
      <rect x="299" y="14" width="16" height="14" rx="2" stroke="#ffffff" stroke-width="1.6" fill="none"/>
      <path d="M 303 14 A 4 4 0 0 1 311 14" stroke="#ffffff" stroke-width="1.6" fill="none"/>
      <!-- Badge dot -->
      <circle cx="317" cy="11" r="5" fill="#F5B700"/>
      <text class="font-sora" x="317" y="13.5" text-anchor="middle" font-size="8" font-weight="700" fill="#1c1c1c">2</text>
    </g>

    <!-- Store Profile Banner Preview -->
    <g transform="translate(24, 108)">
      <rect width="327" height="130" rx="20" fill="#262626" stroke="#3d3d3d" stroke-width="1"/>
      <circle cx="50" cy="50" r="28" fill="#FFF8E6"/>
      <text class="font-sora" x="50" y="56" text-anchor="middle" font-size="18" font-weight="700" fill="#1c1c1c">SC</text>
      <text class="font-sora" x="90" y="44" font-size="16" font-weight="700" fill="#FFFFFF">Sana Canvas</text>
      <!-- Verified Badge -->
      <rect x="90" y="54" width="92" height="22" rx="11" fill="#FFF8E6"/>
      <circle cx="100" cy="65" r="4" fill="#F5B700"/>
      <text class="font-sora" x="108" y="69" font-size="11" font-weight="700" fill="#1c1c1c">Verified Seller</text>
      <!-- Stats -->
      <text class="font-sora" x="90" y="96" font-size="12" font-weight="500" fill="#9ca3af">1,420 Clients • Nairobi Hub</text>
    </g>

    <!-- Dark Overlay behind sheet -->
    <rect y="240" width="375" height="572" fill="#000000" fill-opacity="0.6"/>

    <!-- Bottom Sheet Container (Top radius = 32px) -->
    <g transform="translate(0, 270)" filter="url(#sheet-shadow)">
      <path d="M 0 32 A 32 32 0 0 1 32 0 L 343 0 A 32 32 0 0 1 375 32 L 375 542 L 0 542 Z" fill="#1c1c1c" stroke="#3d3d3d" stroke-width="1.5"/>

      <!-- Drag Pill Handle -->
      <rect x="163" y="12" width="48" height="5" rx="2.5" fill="#555555"/>

      <!-- Sheet Content -->
      <g transform="translate(24, 36)">
        <!-- Product Thumbnail & Title -->
        <rect width="72" height="72" rx="16" fill="#333333"/>
        <rect x="18" y="18" width="36" height="36" rx="8" fill="#FFF8E6"/>
        <text class="font-sora" x="36" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1c1c">BAG</text>
        
        <text class="font-sora" x="88" y="24" font-size="16" font-weight="700" fill="#FFFFFF">Vintage Canvas Tote</text>
        <text class="font-sora" x="88" y="48" font-size="20" font-weight="700" fill="#F5B700">Ksh 2,450</text>
        <rect x="235" y="32" width="92" height="22" rx="11" fill="#FFF8E6"/>
        <text class="font-sora" x="281" y="47" text-anchor="middle" font-size="11" font-weight="700" fill="#1c1c1c">In Stock (14)</text>

        <!-- Variant Selector: Color -->
        <text class="font-sora" x="0" y="112" font-size="13" font-weight="600" fill="#FFFFFF">Color Selection</text>
        <g transform="translate(0, 124)">
          <rect width="98" height="40" rx="12" fill="#F5B700"/>
          <text class="font-sora" x="49" y="25" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1c1c">Mustard</text>

          <rect x="108" y="0" width="98" height="40" rx="12" fill="#262626" stroke="#3d3d3d" stroke-width="1"/>
          <text class="font-sora" x="157" y="25" text-anchor="middle" font-size="13" font-weight="500" fill="#9ca3af">Charcoal</text>

          <rect x="216" y="0" width="98" height="40" rx="12" fill="#262626" stroke="#3d3d3d" stroke-width="1"/>
          <text class="font-sora" x="265" y="25" text-anchor="middle" font-size="13" font-weight="500" fill="#9ca3af">Olive</text>
        </g>

        <!-- Delivery Option Card -->
        <g transform="translate(0, 188)">
          <rect width="327" height="68" rx="16" fill="#262626" stroke="#3d3d3d" stroke-width="1"/>
          <circle cx="34" cy="34" r="16" fill="#FFF8E6"/>
          <!-- Truck icon -->
          <path d="M 26 36 L 26 30 L 37 30 L 41 33 L 41 36 Z" fill="none" stroke="#1c1c1c" stroke-width="1.6"/>
          <circle cx="29" cy="37" r="2.5" fill="#1c1c1c"/>
          <circle cx="38" cy="37" r="2.5" fill="#1c1c1c"/>
          
          <text class="font-sora" x="62" y="28" font-size="14" font-weight="600" fill="#FFFFFF">Mzigo Express Delivery</text>
          <text class="font-sora" x="62" y="48" font-size="12" font-weight="400" fill="#9ca3af">Delivered to your door • Ksh 250</text>
        </g>

        <!-- Primary CTA: 56px, 16px radius, #F5B700 -->
        <g transform="translate(0, 276)">
          <rect width="327" height="56" rx="16" fill="#F5B700"/>
          <text class="font-sora" x="163.5" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1c1c1c">Add to Bag • Ksh 2,450</text>
        </g>
      </g>
    </g>

    <!-- Bottom Navigation Bar (Fixed h=64) -->
    <g transform="translate(0, 748)">
      <rect width="375" height="64" fill="#1c1c1c" stroke="#3d3d3d" stroke-width="1"/>
      <!-- Home tab (active) -->
      <g transform="translate(42, 14)">
        <circle cx="12" cy="12" r="18" fill="#FFF8E6"/>
        <path d="M 5 13 L 12 7 L 19 13 L 19 19 L 5 19 Z" fill="#F5B700"/>
      </g>
      <!-- Search tab -->
      <g transform="translate(118, 20)">
        <circle cx="10" cy="10" r="7" stroke="#9ca3af" stroke-width="1.8" fill="none"/>
        <line x1="15" y1="15" x2="20" y2="20" stroke="#9ca3af" stroke-width="1.8"/>
      </g>
      <!-- Orders tab -->
      <g transform="translate(194, 20)">
        <rect x="3" y="1" width="16" height="18" rx="2" stroke="#9ca3af" stroke-width="1.8" fill="none"/>
        <line x1="7" y1="6" x2="15" y2="6" stroke="#9ca3af" stroke-width="1.5"/>
        <line x1="7" y1="10" x2="13" y2="10" stroke="#9ca3af" stroke-width="1.5"/>
      </g>
      <!-- Bag tab -->
      <g transform="translate(268, 20)">
        <rect x="2" y="4" width="16" height="15" rx="2" stroke="#9ca3af" stroke-width="1.8" fill="none"/>
        <path d="M 6 4 A 4 4 0 0 1 14 4" stroke="#9ca3af" stroke-width="1.8" fill="none"/>
      </g>
      <!-- Profile tab -->
      <g transform="translate(340, 20)">
        <circle cx="6" cy="6" r="5" stroke="#9ca3af" stroke-width="1.8" fill="none"/>
      </g>
    </g>

    <!-- Home Indicator -->
    <rect x="120" y="796" width="135" height="5" rx="2.5" fill="#555555"/>
  </g>
  
</svg>